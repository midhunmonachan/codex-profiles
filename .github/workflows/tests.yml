name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Report line coverage
        run: cargo llvm-cov --locked --workspace --all-features --ignore-filename-regex "tests/|target/"

  tests:
    name: tests-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      CARGO_INCREMENTAL: "0"
      NEXTEST_SHOW_PROGRESS: "none"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.94.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          shared-key: ${{ runner.os }}-tests-${{ hashFiles('rust-toolchain.toml') }}
      - name: Cache cargo bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
      - name: Install nextest
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-nextest@0.9.129

      - name: Run checks
        run: scripts/check.sh --no-audit
      - name: Smoke test executable and npm package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin codex-profiles
          binary=codex-profiles
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target=x86_64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc; binary=codex-profiles.exe ;;
            *) echo "Unsupported smoke-test runner"; exit 1 ;;
          esac
          python scripts/smoke-cli.py --binary "target/debug/${binary}"
          version=$(node -p "require('./package.json').version")
          artifact_dir="target/npm-smoke/artifacts/codex-profiles-${target}"
          mkdir -p "${artifact_dir}" target/npm-smoke/packages
          cp "target/debug/${binary}" "${artifact_dir}/${binary}"
          scripts/package-npm.sh "${version}" target/npm-smoke/artifacts target/npm-smoke/staging
          for package_dir in target/npm-smoke/staging/*; do
            npm pack "./${package_dir}" --pack-destination target/npm-smoke/packages
          done
          npm pack --pack-destination target/npm-smoke/packages
          python scripts/smoke-cli.py --npm-packages target/npm-smoke/packages
      - name: Test release tag helper
        if: runner.os == 'Linux'
        run: python scripts/test-release-tag.py
      - name: Test release artifact verification
        if: runner.os == 'Linux'
        run: python scripts/test-release-artifacts.py
