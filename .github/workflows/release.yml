name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or recover (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  tag-check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: release
        name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi

          [[ -n "${tag}" ]] || { echo "Missing release tag"; exit 1; }
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)(\.[0-9]+)?)?$ ]] \
            || { echo "Tag '${tag}' does not match vX.Y.Z or vX.Y.Z-alpha.N"; exit 1; }

          checked_out_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          [[ "${checked_out_tag}" == "${tag}" ]] \
            || { echo "Checked out ref does not match tag ${tag}"; exit 1; }

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag matches versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          cargo_ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *\"([^\"]+)\".*/\1/')"
          npm_ver="$(python3 - <<'PY'
          import json
          with open("package.json", "r", encoding="utf-8") as fh:
              print(json.load(fh)["version"])
          PY
          )"

          echo "Tag: ${RELEASE_TAG}"
          echo "Tag version: ${RELEASE_VERSION}"
          echo "Cargo version: ${cargo_ver}"
          echo "NPM version: ${npm_ver}"

          [[ "${RELEASE_VERSION}" == "${cargo_ver}" ]] || { echo "Tag ${RELEASE_VERSION} != Cargo.toml ${cargo_ver}"; exit 1; }
          [[ "${RELEASE_VERSION}" == "${npm_ver}" ]] || { echo "Tag ${RELEASE_VERSION} != package.json ${npm_ver}"; exit 1; }

  verify:
    needs: tag-check
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit@0.22.1
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-nextest@0.9.129
      - name: Cache cargo bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          shared-key: ${{ runner.os }}-verify-${{ hashFiles('rust-toolchain.toml') }}
      - name: Run checks
        run: scripts/check.sh

  build:
    needs: [tag-check, verify]
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: codex-profiles
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: codex-profiles
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: codex-profiles
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: codex-profiles
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: codex-profiles.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - name: Cache cargo bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Cargo build
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo build --release --target ${{ matrix.target }} --bin codex-profiles --locked
          echo "Build output:"
          ls -la target/${{ matrix.target }}/release || true
      - name: Smoke test release binary
        shell: bash
        run: python scripts/smoke-cli.py --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" --expected-version "${{ needs.tag-check.outputs.version }}"
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-profiles-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  package:
    needs: [tag-check, build, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: 1.94.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          registry-url: https://registry.npmjs.org
      - name: Cache cargo bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
          restore-keys: |
            ${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-cargo-bin
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/artifacts
      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.tag-check.outputs.version }}"
          scripts/release-artifacts.sh "${version}" dist/artifacts dist
          scripts/verify-artifacts.sh "${version}" dist

      - name: Smoke test npm package
        run: python scripts/smoke-cli.py --npm-packages dist/npm-packages --expected-version "${{ needs.tag-check.outputs.version }}"

      - name: Generate artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/*
            dist/npm-packages/*.tgz
            dist/homebrew/*.rb
            dist/cargo/*.crate
            dist/checksums/*

      - name: Publish to crates.io
        if: ${{ needs.tag-check.outputs.prerelease != 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Safety gate: only publish from production repository
          if [[ "${GITHUB_REPOSITORY}" != "midhunmonachan/codex-profiles" ]]; then
            echo "Skipping crates.io publish: not production repository (current: ${GITHUB_REPOSITORY})"
            exit 0
          fi

          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Warning: CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"
            echo "Add your token at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi

          version="${{ needs.tag-check.outputs.version }}"
          if curl -fsS "https://crates.io/api/v1/crates/codex-profiles/${version}" >/dev/null 2>&1; then
            echo "codex-profiles ${version} is already published to crates.io; skipping"
            exit 0
          fi

          echo "Publishing to crates.io from ${GITHUB_REPOSITORY}..."
          cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"

      - name: Publish to npm
        if: ${{ needs.tag-check.outputs.prerelease != 'true' }}
        run: |
          set -euo pipefail
          # Safety gate: only publish from production repository
          if [[ "${GITHUB_REPOSITORY}" != "midhunmonachan/codex-profiles" ]]; then
            echo "Skipping npm publish: not production repository (current: ${GITHUB_REPOSITORY})"
            exit 0
          fi

          echo "Publishing to npm from ${GITHUB_REPOSITORY} via trusted publishing..."
          node --version
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          python3 - "${npm_version}" <<'PY'
          import sys

          required = (11, 5, 1)
          got = tuple(int(part) for part in sys.argv[1].split(".")[:3])
          if got < required:
              raise SystemExit(
                  f"npm {sys.argv[1]} is too old for trusted publishing; need >= 11.5.1"
              )
          PY
          version="${{ needs.tag-check.outputs.version }}"

          package_name() {
            tar -xOzf "$1" package/package.json \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["name"])'
          }

          publish_if_missing() {
            local pkg="$1"
            local name
            name="$(package_name "$pkg")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping npm publish for ${name}@${version}: already published"
              return 0
            fi

            npm publish "$pkg" --access public --provenance
          }

          # Publish platform packages first so optionalDependencies can resolve.
          for pkg in dist/npm-packages/codex-profiles-*-*.tgz; do
            publish_if_missing "$pkg"
          done

          publish_if_missing "dist/npm-packages/codex-profiles-${version}.tgz"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.tag-check.outputs.tag }}
          files: |
            dist/release/*
            dist/npm-packages/*.tgz
            dist/homebrew/*.rb
            dist/cargo/*.crate
            dist/checksums/*
          generate_release_notes: true
          prerelease: ${{ needs.tag-check.outputs.prerelease == 'true' }}
